<!doctype html>
<html lang="en">
<head>

<title>rinsed.fun airdrop post</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Rubik:wght@900&display=block" rel="stylesheet" />
<style>
  /* 1080x1080 X post in the current brand: bubble mark, gradient wordmark, cyan/violet/pink on #080C18. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #080C18; }
  .post { position: relative; width: 1080px; height: 1080px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center;
    background:
      radial-gradient(520px 380px at 50% 18%, rgba(157,115,250,0.20), transparent 70%),
      radial-gradient(620px 360px at 50% 62%, rgba(22,217,245,0.08), transparent 70%),
      radial-gradient(520px 300px at 50% 104%, rgba(247,49,186,0.14), transparent 70%),
      #080C18; }
  .post > *:not(.float) { position: relative; z-index: 1; }

  /* Copies of the mark floating at the edges; .soft ones sit further back */
  .float { position: absolute; }
  .float.soft { filter: blur(3px); opacity: .45; }

  .mark { margin-top: 64px; width: 210px; height: 210px;
    filter: drop-shadow(0 0 40px rgba(157,115,250,.55)) drop-shadow(0 0 90px rgba(22,217,245,.25)); }
  .wordmark { margin-top: 26px; width: 470px; height: auto; }

  .grad { background: linear-gradient(90deg, #F731BA 0%, #9D73FA 50%, #16D9F5 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .ticker { margin-top: 52px; font: 900 160px/0.92 Rubik, sans-serif; letter-spacing: -4px;
    filter: drop-shadow(0 0 40px rgba(157,115,250,.35)); }
  .airdrop { font: 900 160px/0.92 Rubik, sans-serif; letter-spacing: -4px; color: #F2F5FF; }

  .cta { margin-top: 38px; font: 700 46px Inter, sans-serif; letter-spacing: -0.5px; color: #F2F5FF; }

  .timer { margin-top: 30px; display: inline-flex; align-items: center; gap: 14px; padding: 16px 32px 16px 26px;
    border-radius: 999px; background: linear-gradient(90deg, #F731BA, #B44CF0); color: #fff;
    font: 800 32px Inter, sans-serif; letter-spacing: 2px;
    box-shadow: 0 0 0 6px rgba(247,49,186,.16), 0 18px 48px -12px rgba(247,49,186,.65); }
  .timer svg { width: 34px; height: 34px; }

  .url { position: absolute !important; bottom: 48px; font: 600 26px Inter, sans-serif; color: #7c86a6; letter-spacing: .3px; }
  .url span { color: #F2F5FF; }
</style>
</head>

  <img class="float" src="../../scaffolds/fun-launch/public/brand/mark.png" style="width:170px;left:920px;top:860px" alt="" />
  <img class="float soft" src="../../scaffolds/fun-launch/public/brand/mark.png" style="width:46px;left:800px;top:1000px" alt="" />
  <img class="float soft" src="../../scaffolds/fun-launch/public/brand/mark.png" style="width:36px;left:250px;top:990px" alt="" />
