<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>rinsed.fun X simple</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Rubik:wght@900&display=block" rel="stylesheet" />
<style>
  /* Each piece renders alone at its exact size: kit.html#<id> */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow: hidden; background: #06090f; }
  .art { display: none; position: relative; overflow: hidden; background: #06090f; }
  .art:target { display: flex; }

  /* ---------- Profile pictures: the existing logo-on-navy look ---------- */
  .pfp { width: 400px; height: 400px; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 50%, rgba(62,199,255,0.14), transparent 62%), #06090f; }
  .pfp .logo { width: 250px; height: 219px; transform: translate(-4px, 4px); }

  /* Shiny soap ring just inside X's circle crop */
  .ring { position: absolute; inset: 10px; border-radius: 50%; padding: 7px;
    background: conic-gradient(from 210deg, #3ec7ff, #e9f9ff, #3ec7ff 22%, #1c7fd0 35%, #ff5fa2 52%, #ffe3f0 60%, #ff5fa2 68%, #1c7fd0 82%, #3ec7ff);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    filter: drop-shadow(0 0 10px rgba(62,199,255,.55)); }
  /* Specular glint on the ring */
  .glint { position: absolute; left: 62px; top: 46px; width: 70px; height: 22px; border-radius: 50%;
    background: radial-gradient(closest-side, #fff, rgba(255,255,255,0)); transform: rotate(-38deg); }

  /* Shiny sticker outline traced around the logo itself */
  .sticker { filter:
    drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff)
    drop-shadow(0 0 14px rgba(62,199,255,.75)); }

  /* ---------- Banners: ultra simple ---------- */
  .banner { width: 1500px; height: 500px; flex-direction: column; align-items: center; justify-content: center; padding-bottom: 20px;
    background: radial-gradient(720px 260px at 50% 46%, rgba(62,199,255,0.07), transparent 70%), #06090f; }
  .wm { font: 900 120px/1 Rubik, sans-serif; letter-spacing: -2px; color: #ecf1fa; }
  .wm span { color: #3ec7ff; }
  .motto { margin-top: 26px; font: 500 30px Inter, sans-serif; color: #7f8ba3; }
  .banner > div:not(.foam) { position: relative; z-index: 1; }

  /* Soap bubbles: clear centre, iridescent rim, one glint. .soft ones sit further back. */
  .bub { position: absolute; border-radius: 50%; border: 2px solid rgba(200,238,255,.5);
    background:
      radial-gradient(circle at 30% 27%, rgba(255,255,255,.85) 0 5%, rgba(255,255,255,0) 9%),
      radial-gradient(circle at 70% 76%, rgba(255,255,255,.22) 0 4%, rgba(255,255,255,0) 8%),
      radial-gradient(circle closest-side, rgba(62,199,255,0) 66%, rgba(62,199,255,.2) 82%, rgba(255,95,162,.34) 94%, rgba(255,255,255,.35) 100%); }
  .bub.soft { filter: blur(2px); opacity: .6; }
  /* Foam along the bottom edge */
  .foam { position: absolute; left: 0; right: 0; bottom: -1px; height: 120px; z-index: 0;
    background:
      radial-gradient(70px 46px at 560px 120px, rgba(190,232,255,.2), transparent 70%),
      radial-gradient(110px 64px at 700px 124px, rgba(190,232,255,.24), transparent 70%),
      radial-gradient(90px 52px at 840px 122px, rgba(190,232,255,.2), transparent 70%),
      radial-gradient(140px 70px at 1010px 126px, rgba(190,232,255,.24), transparent 70%),
      radial-gradient(100px 56px at 1180px 122px, rgba(190,232,255,.2), transparent 70%),
      radial-gradient(150px 76px at 1360px 128px, rgba(190,232,255,.24), transparent 70%),
      radial-gradient(90px 50px at 1490px 122px, rgba(190,232,255,.2), transparent 70%); }
</style>
</head>
<body>

<section id="pfp-ring" class="art pfp">
  <div class="ring"></div><div class="glint"></div>
  <img class="logo" src="../../scaffolds/fun-launch/public/logo.svg" alt="" />
</section>

<section id="pfp-sticker" class="art pfp">
  <img class="logo sticker" src="../../scaffolds/fun-launch/public/logo.svg" alt="" />
</section>

<section id="pfp-both" class="art pfp">
  <div class="ring"></div><div class="glint"></div>
  <img class="logo sticker" src="../../scaffolds/fun-launch/public/logo.svg" alt="" />
</section>

<section id="banner-wordmark" class="art banner">
  <i class="bub" style="width:150px;height:150px;left:150px;top:46px"></i>
  <i class="bub" style="width:46px;height:46px;left:290px;top:270px"></i>
  <i class="bub soft" style="width:90px;height:90px;left:40px;top:250px"></i>
  <i class="bub soft" style="width:30px;height:30px;left:420px;top:70px"></i>
  <i class="bub" style="width:22px;height:22px;left:540px;top:430px"></i>
  <i class="bub" style="width:190px;height:190px;left:1230px;top:-50px"></i>
  <i class="bub" style="width:64px;height:64px;left:1210px;top:268px"></i>
  <i class="bub soft" style="width:110px;height:110px;left:1360px;top:300px"></i>
  <i class="bub" style="width:28px;height:28px;left:1090px;top:110px"></i>
  <i class="bub soft" style="width:40px;height:40px;left:960px;top:390px"></i>
  <i class="bub" style="width:18px;height:18px;left:1290px;top:200px"></i>
  <div class="wm">RINSED<span>.FUN</span></div>
</section>

<section id="banner-motto" class="art banner">
  <i class="bub" style="width:150px;height:150px;left:150px;top:46px"></i>
  <i class="bub" style="width:46px;height:46px;left:290px;top:270px"></i>
  <i class="bub soft" style="width:90px;height:90px;left:40px;top:250px"></i>
  <i class="bub soft" style="width:30px;height:30px;left:420px;top:70px"></i>
  <i class="bub" style="width:22px;height:22px;left:540px;top:430px"></i>
  <i class="bub" style="width:190px;height:190px;left:1230px;top:-50px"></i>
  <i class="bub" style="width:64px;height:64px;left:1210px;top:268px"></i>
  <i class="bub soft" style="width:110px;height:110px;left:1360px;top:300px"></i>
  <i class="bub" style="width:28px;height:28px;left:1090px;top:110px"></i>
  <i class="bub soft" style="width:40px;height:40px;left:960px;top:390px"></i>
  <i class="bub" style="width:18px;height:18px;left:1290px;top:200px"></i>
  <div class="wm">RINSED<span>.FUN</span></div>
  <div class="motto">Snipers get rinsed. Holders get paid.</div>
</section>

</body>
</html>
